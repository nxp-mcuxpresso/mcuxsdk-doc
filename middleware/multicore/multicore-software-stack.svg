<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mcsdk-stack-svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Multicore SDK software stack">
  <defs>
    <!-- NXP brand primaries -->
    <!-- Orange #F9B500 | Blue #0EAFE0 | Green #69CA00 -->

    <style>
      .h1 { font: 700 26px/1.2 Poppins, Arial, sans-serif; fill: #0b1f33; }
      .h2 { font: 700 16px/1.2 Poppins, Arial, sans-serif; fill: #0b1f33; }
      .p  { font: 500 13px/1.35 Poppins, Arial, sans-serif; fill: #3b4a5a; }
      .label { font: 600 12px/1.2 Poppins, Arial, sans-serif; fill: #3b4a5a; }

      .panelStroke { stroke: rgba(11,31,51,0.16); stroke-width: 1.5; }
      .cardStroke  { stroke: rgba(11,31,51,0.16); stroke-width: 1.5; }

      /* Clickable regions */
      a.hotspot { cursor: pointer; pointer-events: all; }
      a.hotspot:focus { outline: none; }
      .hit  { fill: transparent; pointer-events: all; }
      .halo { opacity: 0; transition: opacity 160ms ease; pointer-events: none; }
      .tile { transition: filter 160ms ease; }

      /* Stable hover (no transforms): halo + shadow + outline */
      a.hotspot:hover .halo { opacity: 1; }
      a.hotspot:hover .tile { filter: drop-shadow(0 14px 18px rgba(0,0,0,0.14)); }
      a.hotspot:hover .tile rect.cardBorder { stroke: rgba(14,175,224,0.65); stroke-width: 2.2; }
    </style>

    <!-- Subtle searchlight background (32 degree feel) -->
    <linearGradient id="searchlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69CA00" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#0EAFE0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F9B500" stop-opacity="0.10"/>
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <filter id="haloBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Clip paths to keep the top accent bars inside rounded cards -->
    <clipPath id="clipCard270">
      <rect x="0" y="0" width="270" height="88" rx="18" ry="18"/>
    </clipPath>
    <clipPath id="clipCard424">
      <rect x="0" y="0" width="424" height="182" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <!-- Main panel -->
  <g filter="url(#panelShadow)">
    <rect x="70" y="70" width="840" height="490" rx="22" ry="22" fill="#ffffff" class="panelStroke"/>
    <!-- subtle searchlight overlay -->
    <path d="M150 95 L450 95 L860 410 L560 410 Z" fill="url(#searchlight)"/>
    <path d="M120 155 L340 155 L740 465 L520 465 Z" fill="url(#searchlight)" opacity="0.65"/>
  </g>

  <!-- Title -->
  <text x="120" y="130" class="h1">Multicore SDK</text>
  <text x="120" y="154" class="p">Key middleware components and their relationship to drivers and hardware</text>

  <!-- Section label -->
  <text x="123" y="205" class="label">Multicore middleware</text>

  <!-- Cards layout coordinates -->
  <!-- Left stack: eRPC, RPMSG-Lite; Right: MCMGR -->

  <!-- eRPC (clickable) -->
  <a class="hotspot" xlink:href="erpc.html">
    <rect class="halo" x="113" y="220" width="290" height="108" rx="22" ry="22" fill="rgba(249,181,0,0.22)" filter="url(#haloBlur)"/>
    <rect class="hit"  x="123" y="230" width="270" height="88" rx="18" ry="18"/>
    <g class="tile" transform="translate(123 230)">
      <rect class="cardBorder cardStroke" x="0" y="0" width="270" height="88" rx="18" ry="18" fill="#ffffff"/>
      <!-- Accent bar (clipped to rounded card) -->
      <g clip-path="url(#clipCard270)">
        <rect x="0" y="0" width="270" height="10" fill="#F9B500" opacity="0.95"/>
      </g>
      <text x="20" y="44" class="h2">eRPC</text>
      <text x="20" y="66" class="p">Remote procedure calls</text>
    </g>
  </a>

  <!-- RPMSG-Lite (clickable) -->
  <a class="hotspot" xlink:href="rpmsg-lite.html">
    <rect class="halo" x="113" y="320" width="290" height="108" rx="22" ry="22" fill="rgba(105,202,0,0.20)" filter="url(#haloBlur)"/>
    <rect class="hit"  x="123" y="330" width="270" height="88" rx="18" ry="18"/>
    <g class="tile" transform="translate(123 330)">
      <rect class="cardBorder cardStroke" x="0" y="0" width="270" height="88" rx="18" ry="18" fill="#ffffff"/>
      <!-- Accent bar (clipped to rounded card) -->
      <g clip-path="url(#clipCard270)">
        <rect x="0" y="0" width="270" height="10" fill="#69CA00" opacity="0.95"/>
      </g>
      <text x="20" y="44" class="h2">RPMSG-Lite</text>
      <text x="20" y="66" class="p">Inter-core messaging</text>
    </g>
  </a>

  <!-- MCMGR (clickable) -->
  <a class="hotspot" xlink:href="mcmgr.html">
    <rect class="halo" x="417" y="214" width="456" height="214" rx="26" ry="26" fill="rgba(14,175,224,0.18)" filter="url(#haloBlur)"/>
    <rect class="hit"  x="433" y="230" width="424" height="182" rx="20" ry="20"/>
    <g class="tile" transform="translate(433 230)">
      <rect class="cardBorder cardStroke" x="0" y="0" width="424" height="182" rx="20" ry="20" fill="#ffffff"/>
      <!-- Accent bar (clipped to rounded card) -->
      <g clip-path="url(#clipCard424)">
        <rect x="0" y="0" width="424" height="10" fill="#0EAFE0" opacity="0.95"/>
      </g>
      <text x="20" y="44" class="h2">Multicore Manager</text>
      <text x="20" y="68" class="p">Core start/stop, events, monitoring</text>
      <text x="20" y="92" class="p" fill="#3b4a5a">(MCMGR)</text>

      <!-- Simple chips -->
      <g transform="translate(20 116)">
        <rect x="0" y="0" width="104" height="30" rx="999" ry="999" fill="rgba(14,175,224,0.12)"/>
        <text x="52" y="20" text-anchor="middle" class="label" fill="#0b1f33">control</text>

        <rect x="116" y="0" width="88" height="30" rx="999" ry="999" fill="rgba(105,202,0,0.12)"/>
        <text x="160" y="20" text-anchor="middle" class="label" fill="#0b1f33">events</text>

        <rect x="216" y="0" width="120" height="30" rx="999" ry="999" fill="rgba(249,181,0,0.14)"/>
        <text x="276" y="20" text-anchor="middle" class="label" fill="#0b1f33">monitoring</text>
      </g>
    </g>
  </a>

  <!-- Drivers + Hardware -->
  <g>
    <rect x="123" y="430" width="734" height="56" rx="16" ry="16" fill="rgba(105,202,0,0.12)" class="panelStroke"/>
    <text x="490" y="465" text-anchor="middle" class="h2">MCUXpresso Drivers</text>

    <rect x="123" y="500" width="734" height="56" rx="16" ry="16" fill="rgba(249,181,0,0.14)" class="panelStroke"/>
    <text x="490" y="535" text-anchor="middle" class="h2">Hardware</text>
  </g>
</svg>
